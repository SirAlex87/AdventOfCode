spring.application.name=AdventOfCode
welcome.message=ciao

# ============================================================
# DATASOURCE TEMPORANEO - H2 IN MEMORY
# ============================================================

spring.datasource.url=jdbc:h2:mem:adventofcode
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Database esclusivamente temporaneo.
# In futuro sara sostituito da Oracle o PostgreSQL.